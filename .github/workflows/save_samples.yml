name: 2 - Save page samples
on:
  workflow_dispatch:
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download pages
        shell: python
        run: |
          import urllib.request, os, time
          os.makedirs("samples", exist_ok=True)
          H = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/128.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8",
              "Accept-Language": "uk-UA,uk;q=0.9",
          }
          PAGES = {
              "lun": "https://lun.ua/rent/uz/flats",
              "tg_orenda_budinku": "https://t.me/s/orenda_budinku",
              "tg_orendari_uzhhorod": "https://t.me/s/orendari_uzhhorod",
              "domria_1": "https://dom.ria.com/uk/arenda-kvartir/uzhgorod/",
              "domria_2": "https://dom.ria.com/arenda-kvartir/uzhgorod/",
              "domria_3": "https://dom.ria.com/node/searchEngine/v2/?category=1&realty_type=2&operation=3&state_id=22&city_id=22&sort=created_at&limit=20",
          }
          for name, url in PAGES.items():
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers=H)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          data = r.read()
                      open(f"samples/{name}.html", "wb").write(data)
                      print(f"{name:22} OK   {len(data)} bytes (attempt {attempt+1})")
                      break
                  except Exception as e:
                      print(f"{name:22} FAIL attempt {attempt+1}: {e}")
                      time.sleep(5)
      - uses: actions/upload-artifact@v4
        with:
          name: samples
          path: samples/
