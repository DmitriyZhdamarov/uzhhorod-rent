name: 1 - Check sources access
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check access
        shell: python
        run: |
          """Крок 1: перевірка, чи пускають джерела запити з серверів GitHub.
          Нічого не надсилає, лише друкує результат у журнал запуску."""
          import urllib.request, ssl, re

          SOURCES = {
              "DIM.RIA": "https://dom.ria.com/uk/arenda-kvartir/uzhgorod/",
              "LUN": "https://lun.ua/rent/uz/flats",
              "OLX": "https://www.olx.ua/uk/nedvizhimost/kvartiry/dolgosrochnaya-arenda-kvartir/uzhgorod/?search%5Border%5D=created_at:desc",
              "TG orenda_budinku": "https://t.me/s/orenda_budinku",
              "TG orendari_uzhhorod": "https://t.me/s/orendari_uzhhorod",
          }
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/128.0 Safari/537.36",
              "Accept-Language": "uk-UA,uk;q=0.9",
          }
          ctx = ssl.create_default_context()
          print(f"{'Джерело':22} | {'Статус':6} | {'Розмір':8} | Ознаки оголошень")
          print("-" * 70)
          for name, url in SOURCES.items():
              try:
                  req = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
                      html = r.read().decode("utf-8", "ignore")
                      status = r.status
              except urllib.error.HTTPError as e:
                  print(f"{name:22} | {e.code:<6} | {'-':8} | ЗАБЛОКОВАНО/ПОМИЛКА")
                  continue
              except Exception as e:
                  print(f"{name:22} | {'ERR':6} | {'-':8} | {type(e).__name__}: {e}")
                  continue
              hints = {
                  "м²": html.count("м²"),
                  "$": len(re.findall(r"\d\s?\$|\$\s?\d", html)),
                  "грн": html.count("грн"),
              }
              print(f"{name:22} | {status:<6} | {len(html):<8} | {hints}")
